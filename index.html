<!doctype html>
<html lang="pt-BR">
<head>
<title>Ecos do Crepúsculo</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#120c1c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: coluna única de até 480px, centrada; janelas no estilo "caixa de diálogo" de RPG 16 bits. */
:root {
  --night: #120c1c;      /* fundo: céu depois do pôr do sol */
  --dusk: #22162f;       /* painéis */
  --window: #0d0a1c;     /* janelas de diálogo */
  --frame: #efe3cf;      /* moldura das janelas */
  --ink: #f4e9d8;        /* texto principal */
  --muted: #b3a3c4;      /* texto secundário */
  --amber: #f3a64a;      /* destaque: o sol parado */
  --ember: #e2574a;      /* PV / perigo */
  --tide: #5ad0c0;       /* MP */
  --gold: #ffd860;       /* ATB / prontidão */
  --violet: #8a6ad0;     /* técnica dupla */
  --display: 'Press Start 2P', 'Courier New', monospace;
  --body: 'VT323', 'Courier New', monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--night); color: var(--ink);
  font-family: var(--body); font-size: 21px; line-height: 1.15;
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  touch-action: manipulation; user-select: none; -webkit-user-select: none;
}
#app {
  height: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
#bar {
  display: flex; align-items: center; gap: 8px; min-height: 48px; flex: none;
  border-bottom: 2px solid #2e2140;
}
#where { flex: 1; min-width: 0; font-family: var(--display); font-size: 9px; color: var(--muted); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#view { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 10px; padding-block: 10px 14px; }

button { font: inherit; color: inherit; }
.btn {
  min-height: 48px; min-width: 48px; padding: 8px 12px; border-radius: 6px; cursor: pointer;
  background: var(--window); color: var(--ink); border: 2px solid var(--frame);
  box-shadow: inset 0 0 0 2px var(--window), inset 0 0 0 3px #5a4a70;
  font-family: var(--display); font-size: 10px; line-height: 1.5; text-align: center;
}
.btn:active { transform: translateY(1px); background: #1d1533; }
.btn:focus-visible, .node:focus-visible, .card:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.btn.primary { border-color: var(--amber); color: var(--amber); }
.btn.tech { border-color: var(--violet); color: #d6c6ff; }
.btn.tech.ready { animation: pulse 1s ease-in-out infinite; border-color: var(--gold); color: var(--gold); }
.btn[aria-disabled="true"] { opacity: 0.45; }
.btn.chip { min-height: 44px; min-width: 44px; padding: 6px 8px; font-size: 8px; }
.btn.small { font-size: 9px; }
@keyframes pulse { 50% { box-shadow: inset 0 0 0 2px var(--window), 0 0 10px var(--gold); } }

.win {
  background: var(--window); border: 2px solid var(--frame); border-radius: 6px;
  box-shadow: inset 0 0 0 2px var(--window), inset 0 0 0 3px #5a4a70; padding: 10px 12px;
}
.win h2, .h { font-family: var(--display); font-size: 11px; color: var(--amber); margin: 0 0 8px; line-height: 1.5; text-wrap: balance; }
.muted { color: var(--muted); }
.row { display: flex; gap: 8px; align-items: center; }
.grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
canvas.px { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }

/* título */
.title-art { position: relative; border: 2px solid var(--frame); border-radius: 6px; overflow: hidden; }
.title-art canvas { width: 100%; height: auto; }
.logo { font-family: var(--display); color: var(--amber); font-size: 18px; line-height: 1.35; text-align: center; margin: 6px 0 0; text-shadow: 2px 2px 0 #6a2a3a, 4px 4px 0 #1a0f26; letter-spacing: 1px; text-wrap: balance; }
.sub { text-align: center; color: var(--muted); font-size: 19px; margin: 0; }
.note { font-size: 17px; color: var(--muted); text-align: center; }
input.seed { width: 100%; min-height: 48px; background: var(--window); color: var(--ink); border: 2px solid #5a4a70; border-radius: 6px; padding: 6px 10px; font-family: var(--display); font-size: 11px; text-transform: uppercase; }

/* seleção de grupo */
.card { text-align: left; display: flex; flex-direction: column; gap: 4px; align-items: stretch; font-family: var(--body); font-size: 18px; line-height: 1.1; padding: 8px; }
.card .nm { font-family: var(--display); font-size: 10px; color: var(--ink); }
.card .rl { color: var(--amber); }
.card.sel { border-color: var(--amber); box-shadow: inset 0 0 0 2px var(--window), 0 0 0 2px var(--amber); }
.stats { display: grid; grid-template-columns: repeat(3, auto); gap: 0 8px; color: var(--muted); font-size: 16px; font-variant-numeric: tabular-nums; }

/* mapa */
.map { position: relative; flex: none; }
.map svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.node { position: absolute; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; border: 2px solid #4a3a60; background: #1a1228; padding: 0; display: grid; place-items: center; cursor: pointer; }
.node canvas { width: 27px; height: 27px; }
.node.avail { border-color: var(--gold); background: #2a1c3a; animation: pulse 1.2s ease-in-out infinite; }
.node.done { border-color: #6a5a80; background: #3a2a4a; }
.node.here { border-color: var(--amber); background: #4a2a2a; }
.node.locked { opacity: 0.55; }
.node.boss { width: 60px; height: 60px; margin: -30px 0 0 -30px; border-color: var(--ember); }
.node.boss canvas { width: 36px; height: 36px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 16px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend canvas { width: 18px; height: 18px; }

/* status do grupo */
.party { display: grid; gap: 4px; }
.pm { display: grid; grid-template-columns: 62px 1fr 1fr; gap: 2px 8px; align-items: center; font-size: 18px; font-variant-numeric: tabular-nums; padding: 3px 6px; border-radius: 4px; }
.pm.turn { background: #2e2044; outline: 1px solid var(--gold); }
.pm.ko { opacity: 0.5; }
.pm .n { font-family: var(--display); font-size: 9px; }
.bar { height: 7px; background: #2a1e38; border-radius: 2px; overflow: hidden; position: relative; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--ember); transition: width 0.18s linear; }
.bar.mp i { background: var(--tide); }
.bar.atb i { background: var(--gold); transition: none; }
.bar.atb.full i { background: #fff3a0; }
.lbl { display: flex; justify-content: space-between; font-size: 16px; color: var(--muted); }
.sts { font-size: 15px; color: var(--gold); grid-column: 2 / 4; }
.sts:empty { display: none; }
.party .pm.win { padding: 4px 8px; }

/* combate */
.stage { position: relative; align-self: center; flex: none; }
.stage canvas { border: 2px solid var(--frame); border-radius: 4px; }
.pop { position: absolute; transform: translate(-50%, -50%); font-family: var(--display); font-size: 12px; color: #fff; text-shadow: 2px 2px 0 #000, -1px -1px 0 #000; pointer-events: none; animation: rise 0.9s ease-out forwards; white-space: nowrap; }
.pop.heal { color: #8cf08c; } .pop.mp { color: var(--tide); } .pop.crit { color: var(--gold); font-size: 15px; } .pop.st { font-size: 8px; color: #e0d0ff; } .pop.poison { color: #b080ff; }
@keyframes rise { 0% { opacity: 0; margin-top: 4px; } 15% { opacity: 1; } 100% { opacity: 0; margin-top: -26px; } }
.msg { min-height: 54px; font-size: 21px; display: flex; align-items: center; }
.msg .who { font-family: var(--display); font-size: 9px; color: var(--amber); margin-right: 6px; }
.cmds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.cmds .btn { padding: 6px 4px; font-size: 9px; }
.list { display: flex; flex-direction: column; gap: 6px; }
.list .btn { text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-family: var(--body); font-size: 19px; line-height: 1.1; }
.list .btn b { font-family: var(--display); font-size: 9px; font-weight: normal; }
.list .btn small { color: var(--muted); font-size: 16px; display: block; }
.list .btn .cost { color: var(--tide); font-family: var(--display); font-size: 8px; white-space: nowrap; }

/* recompensas / história */
.opt { text-align: left; font-family: var(--body); font-size: 19px; display: flex; flex-direction: column; gap: 2px; align-items: flex-start; }
.opt .k { font-family: var(--display); font-size: 8px; color: var(--violet); }
.opt .k.relic { color: var(--amber); } .opt .k.item { color: var(--tide); }
.opt .t { font-family: var(--display); font-size: 10px; }
.story { display: flex; gap: 10px; align-items: flex-start; }
.story .txt { font-size: 22px; min-height: 100px; flex: 1; min-width: 0; }
.speaker { font-family: var(--display); font-size: 9px; color: var(--amber); margin-bottom: 6px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--window); border: 2px solid var(--frame); border-radius: 6px; padding: 8px 14px; font-size: 18px; z-index: 20; max-width: calc(100% - 32px); }
.overlay { position: fixed; inset: 0; background: rgba(8, 5, 14, 0.86); z-index: 15; display: flex; justify-content: center; padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.overlay > .win { width: 100%; max-width: 448px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.kv { display: flex; justify-content: space-between; gap: 8px; font-variant-numeric: tabular-nums; }
.dots { color: var(--amber); letter-spacing: 2px; }
.blink { animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .node.avail, .btn.tech.ready, .blink { animation: none; }
  .pop { animation: fade 0.9s forwards; }
  @keyframes fade { to { opacity: 0; } }
}

.dock { position: sticky; bottom: -14px; background: var(--night); padding-block: 8px 14px; margin-bottom: -14px; z-index: 2; }
body.nofont { font-size: 16px; }
body.nofont .story .txt, body.nofont .msg { font-size: 17px; }
body.nofont .list .btn, body.nofont .opt, body.nofont .card { font-size: 15px; }
</style>
</head>
<body>
<div id="app"></div>
<script id="data">
// ============================================================================
// DATA — tabelas de jogo. Equilibrar = editar números aqui.
// Nenhuma lógica neste arquivo: engine.js lê estas tabelas.
// ============================================================================
var DATA = {
  version: 1,

  // ATB (Active Time Battle): cada unidade enche a barra com SPD por tick.
  atb: { full: 300, ticksPerSecond: 12, heroStartMax: 150, enemyStartMax: 120 },

  rules: {
    critChance: 0.05, critMul: 1.6, variance: 0.12,
    defendMp: 4,                 // Defender recupera MP
    koReviveFrac: 0.15,          // herói nocauteado volta com 15% PV após vitória

    levelXp: [0, 25, 60, 110, 175, 255, 350, 460, 590, 740, 910, 1100],
    levelGain: { hp: 0.09, atk: 1, mag: 1, def: 1 },
    tickCap: 40000,              // trava de segurança: nunca deve ser atingida
    itemSlots: 4,
    itemDropChance: 0.3,
    restHeal: 0.4,
    floorScale: 0.06,            // inimigos +6% PV/ATQ por andar dentro do ato
    rewardChoices: 3
  },

  status: {
    poison: { frac: 0.06 },      // % do PV máx por turno do afetado
    haste: { spdMul: 1.6 },
    slow: { spdMul: 0.55 },
    guard: { mul: 0.5 },
    shield: { mul: 0.6 },
    atkUp: { mul: 1.3 },
    prism: { magMul: 0.4 },      // reduz dano mágico recebido
    taunt: {},
    stun: {}
  },

  // ---------------------------------------------------------------- HERÓIS
  heroes: {
    rocca: {
      name: 'Rocca', title: 'Escudo de Bronze', role: 'Guardiã',
      hp: 132, mp: 26, atk: 14, mag: 4, def: 11, spd: 9,
      start: ['golpeEscudo', 'provocar'], learn: ['terremoto', 'fortaleza', 'martelo'],
      blurb: 'Carrega um escudo maior que ela. Protege, provoca e atordoa.'
    },
    lume: {
      name: 'Lume', title: 'Lanterna do Ocaso', role: 'Maga',
      hp: 86, mp: 46, atk: 6, mag: 17, def: 6, spd: 10,
      start: ['faisca', 'chamaAlta'], learn: ['meteoro', 'lentidao', 'meditar'],

    pena: {
      name: 'Pena', title: 'Vento da Madrugada', role: 'Arqueira',
      hp: 88, mp: 28, atk: 13, mag: 5, def: 6, spd: 14,
      start: ['flechaDupla', 'roubar'], learn: ['venenoPena', 'chuvaPenas', 'passoAgil'],
      blurb: 'Máscara de pássaro e cachecol ao vento. A mais rápida: age muitas vezes.'

    sino: {
      name: 'Sino', title: 'Badalo das Vésperas', role: 'Clériga',

      start: ['cura', 'badalo'], learn: ['cancaoSerena', 'reviver', 'dobre'],
      blurb: 'Leva um sino nas costas. Cura e, ao badalar, adianta o turno da parceira.'

  // ---------------------------------------------------------------- TÉCNICAS
  // target: enemy | enemies | ally | allies | self | deadAlly | partner
  // fx: dmg{stat,pow,hits,random,pierce} heal{pow} status{s,dur,chance,to} mp{v} atb{v,to} revive{frac} steal{chance}

    golpeEscudo: { name: 'Golpe de Escudo', owner: 'rocca', mp: 6, target: 'enemy',
      fx: [{ t: 'dmg', stat: 'atk', pow: 1.3 }, { t: 'status', s: 'stun', dur: 1, chance: 0.5 }],
      desc: 'Dano físico e 50% de atordoar.' },

      fx: [{ t: 'status', s: 'shield', dur: 4 }],

    martelo: { name: 'Martelo do Juízo', owner: 'rocca', mp: 13, target: 'enemy',
      fx: [{ t: 'dmg', stat: 'atk', pow: 2.8 }],
      desc: 'Golpe físico enorme em um alvo.' },

    faisca: { name: 'Faísca', owner: 'lume', mp: 5, target: 'enemy',
      fx: [{ t: 'dmg', stat: 'mag', pow: 1.4 }], desc: 'Dano mágico em um alvo.' },
    chamaAlta: { name: 'Chama Alta', owner: 'lume', mp: 11, target: 'enemies',
      fx: [{ t: 'dmg', stat: 'mag', pow: 1.0 }], desc: 'Dano mágico em todos.' },
    meteoro: { name: 'Meteoro Miúdo', owner: 'lume', mp: 18, target: 'enemy',
      fx: [{ t: 'dmg', stat: 'mag', pow: 2.8 }], desc: 'Dano mágico enorme em um alvo.' },
    lentidao: { name: 'Lentidão', owner: 'lume', mp: 8, target: 'enemies',

    flechaDupla: { name: 'Flecha Dupla', owner: 'pena', mp: 5, target: 'enemy',
      fx: [{ t: 'dmg', stat: 'atk', pow: 0.75, hits: 2 }], desc: 'Dois disparos.' },

    venenoPena: { name: 'Pena Venenosa', owner: 'pena', mp: 6, target: 'enemy',

    chuvaPenas: { name: 'Chuva de Penas', owner: 'pena', mp: 13, target: 'enemies',

      fx: [{ t: 'dmg', stat: 'mag', pow: 0.8 }, { t: 'status', s: 'stun', dur: 1, chance: 0.25 }],
      desc: 'Dano mágico em todos, 25% de atordoar.' }
  },

  // ---------------------------------------------------------------- TÉCNICAS DUPLAS
  // Exigem as duas heroínas com ATB cheia e MP de ambas (adaptado das Techs de Chrono Trigger).
  // Dano usa a SOMA do atributo das duas.
  techs: {
    bastiao: { name: 'Bastião Ígneo', pair: ['rocca', 'lume'], cost: { rocca: 8, lume: 8 }, target: 'enemies',
      fx: [{ t: 'dmg', stat: 'mag', pow: 1.45 }, { t: 'status', s: 'shield', dur: 2, to: 'allies' }],
      desc: 'Chamas em todos + barreira no grupo.' },
    catapulta: { name: 'Catapulta', pair: ['rocca', 'pena'], cost: { rocca: 8, pena: 8 }, target: 'enemy',

  // ---------------------------------------------------------------- CONSUMÍVEIS
  items: {
    erva: { name: 'Erva de Vésper', target: 'ally', fx: [{ t: 'healPct', v: 0.45 }], desc: 'Cura 45% do PV.' },

  function newRun(seed, partyIds, meta) {
    var run = {
      v: 1, seed: seed >>> 0, rng: seed | 0, party: partyIds.map(makeHero), relics: [], items: [],
      act: 0, map: null, pos: null, phase: 'map', pending: null, battle: null, over: null,
      stats: { floors: 0, battles: 0, elites: 0, bosses: 0, ticks: 0, decisions: 0, nodes: [] },
      seenEvents: [], fenixUsed: false, metaMod: metaMods(meta), log: []
    };
    var mm = run.metaMod;
    for (var i = 0; i < mm._startErva; i++) run.items.push('erva');
    if (mm._startRelic) {
      var commons = Object.keys(D.relics).filter(function (r) { return D.relics[r].rarity === 'c'; });
      run.relics.push(pick(run, commons));
    }
    recalcAll(run);
    run.party.forEach(function (h) { h.hp = h.maxHp; h.mp = h.maxMp; });
    genMap(run);
    return run;
  }

  // Mapa ramificado (Slay the Spire): caminhos de baixo para cima, sem arestas cruzadas.
  function genMap(run) {
    var M = D.map, nodes = {}, key = function (r, c) { return r + ':' + c; };
    var edges = {};
    function edge(a, b) { edges[a] = edges[a] || {}; edges[a][b] = true; }
    function hasEdge(r, c1, c2) { return edges[key(r, c1)] && edges[key(r, c1)][key(r + 1, c2)]; }
    var starts = shuffle(run, [0, 1, 2, 3]);
    for (var p = 0; p < M.paths; p++) {
      var col = p < 2 ? starts[p] : rint(run, M.cols);
      for (var r = 0; r < M.rows; r++) {
        nodes[key(r, col)] = nodes[key(r, col)] || { id: key(r, col), row: r, col: col, type: null, next: [] };
        if (r < M.rows - 1) {
          var nc = clamp(col + rint(run, 3) - 1, 0, M.cols - 1);
          // evita cruzamento: se existe aresta (r, nc) -> (r+1, col), anda reto
          if (nc !== col && hasEdge(r, nc, col)) nc = col;
          edge(key(r, col), key(r + 1, nc));
          col = nc;
        }
      }
    }
    var ids = Object.keys(nodes).sort();
    ids.forEach(function (id) {
      var n = nodes[id];
      n.next = Object.keys(edges[id] || {}).sort();
      if (n.row === M.rows - 1) n.next = ['boss'];
    });
    nodes.boss = { id: 'boss', row: M.rows, col: 1.5, type: 'boss', next: [] };
    // tipos
    var W = M.weights;
    ids.forEach(function (id) {
      var n = nodes[id];
      if (n.row === 0) n.type = M.firstRow;
      else if (n.row === M.rows - 1) n.type = M.lastRow;
      else {
        var opts = [];
        for (var t in W) {
          if (t === 'elite' && n.row < M.eliteMinRow) continue;
          if (t === 'rest' && n.row === M.rows - 2) continue;
          opts.push([t, W[t]]);
        }
        var tot = opts.reduce(function (s, o) { return s + o[1]; }, 0), x = rnd(run) * tot;
        for (var i = 0; i < opts.length; i++) { x -= opts[i][1]; if (x <= 0) { n.type = opts[i][0]; break; } }
        if (!n.type) n.type = 'combat';
      }
    });
    // garante ao menos um tesouro no meio do ato
    var mid = ids.filter(function (id) { return nodes[id].row === 3; });
    if (mid.length && !mid.some(function (id) { return nodes[id].type === 'treasure'; })) nodes[pick(run, mid)].type = 'treasure';
    run.map = nodes;
    run.pos = null;
  }

  function validateMap(run) {
    var nodes = run.map, problems = [];
    var reach = {};
    var frontier = Object.keys(nodes).filter(function (id) { return nodes[id].row === 0; });
    if (!frontier.length) problems.push('sem nós iniciais');
    while (frontier.length) {
      var id = frontier.pop();
      if (reach[id]) continue;
      reach[id] = true;
      var n = nodes[id];
      if (id !== 'boss' && !n.next.length) problems.push('beco sem saída em ' + id);
      n.next.forEach(function (x) { if (!nodes[x]) problems.push('aresta inválida ' + id + '->' + x); else frontier.push(x); });
    }
    if (!reach.boss) problems.push('chefe inalcançável');
    Object.keys(nodes).forEach(function (id) { if (!reach[id]) problems.push('nó inalcançável ' + id); });
    return problems;
  }

  function availableNodes(run) {
    if (run.phase !== 'map') return [];
    if (run.pos == null) return Object.keys(run.map).filter(function (id) { return run.map[id].row === 0; }).sort();
    return run.map[run.pos].next.slice();
  }

  function enterNode(run, id) {
    if (availableNodes(run).indexOf(id) < 0) throw new Error('nó indisponível: ' + id);
    run.pos = id;
    var n = run.map[id];
    run.stats.nodes.push(n.type);
    run.stats.decisions++;
    var act = D.acts[run.act];
    if (n.type === 'combat' || n.type === 'elite' || n.type === 'boss') {
      var group;
      if (n.type === 'boss') group = [act.boss];
      else if (n.type === 'elite') group = pick(run, act.elite);
      else group = pick(run, n.row <= 1 ? act.weak : act.normal);
      run.battle = startBattle(run, group, n.type, n.row);
      run.phase = 'battle';
    } else if (n.type === 'rest') {
      run.phase = 'rest';
      run.pending = { options: ['rest', 'train'] };
    } else if (n.type === 'treasure') {
      run.phase = 'treasure';
      var a = relicPool(run, null), b;
      run.pending = { options: shuffle(run, a).slice(0, 2).map(function (r) { return { kind: 'relic', id: r }; }) };
      if (!run.pending.options.length) run.pending.options = [{ kind: 'item', id: 'elixir' }];
    } else if (n.type === 'event') {
      var pool = Object.keys(D.events).filter(function (e) { return run.seenEvents.indexOf(e) < 0; });
      if (!pool.length) pool = Object.keys(D.events);
      var ev = pick(run, pool);
      run.seenEvents.push(ev);
      run.phase = 'event';
      run.pending = { id: ev, result: null };
    }
    return run.phase;
  }

  function completeNode(run) {
    run.stats.floors++;
    run.pending = null;
    var n = run.map[run.pos];
    if (n.type === 'boss') {
      if (run.act >= D.acts.length - 1) { run.phase = 'over'; run.over = { won: true }; return; }
      run.act++;
      run.fenixUsed = false;
      genMap(run);
    }
    run.phase = 'map';
  }

  // ---------------------------------------------------------------- combate ATB
  function makeEnemy(run, id, kind, row) {
    var e = D.enemies[id];
    var sc = 1 + D.rules.floorScale * (row || 0);
    if (kind === 'boss') sc = 1;
    return { id: id, name: e.name, hp: Math.round(e.hp * sc), maxHp: Math.round(e.hp * sc), atk: e.atk * (1 + (sc - 1) * 0.5),
      mag: e.mag * (1 + (sc - 1) * 0.5), def: e.def, spd: e.spd, atb: 0, st: {}, turns: 0, used: {}, enemy: true };
  }

  function startBattle(run, group, kind, row) {
    var m = mods(run);
    var B = { kind: kind, enemies: group.map(function (id) { return makeEnemy(run, id, kind, row); }), tick: 0, prompt: null,
      result: null, turn: 0, group: group.slice() };
    run.party.forEach(function (h) {
      h.st = {}; h.held = false; h.ready = false; h.started = false;
      h.atb = h.hp > 0 ? (m.startAtb ? D.atb.full : Math.min(D.atb.full - 1, Math.floor(rnd(run) * D.atb.heroStartMax + (m.startAtbBonus || 0) * D.atb.full))) : 0;
    });
    B.enemies.forEach(function (e) { e.atb = m.enemyStartAtb ? 0 : Math.floor(rnd(run) * D.atb.enemyStartMax); });
    run.stats.battles++;
    return B;
  }

  function alive(u) { return u.hp > 0; }
  function effSpd(run, u) {
    var s = u.enemy ? u.spd * mget(mods(run), 'enemySpdMul', 1) : stat(run, u, 'spd');
    if (u.st.haste) s *= D.status.haste.spdMul;
    if (u.st.slow) s *= D.status.slow.spdMul;
    return Math.max(1, s);
  }
  function unitRef(run, u) {
    var i = run.party.indexOf(u);
    if (i >= 0) return { side: 'h', i: i };
    return { side: 'e', i: run.battle.enemies.indexOf(u) };
  }
  function uStat(run, u, s) { return u.enemy ? u[s] : stat(run, u, s); }

  // avança 1 tick. Retorna lista de eventos (ação inimiga) ou null.
  function stepBattle(run) {
    var B = run.battle;
    if (!B || B.result || B.prompt != null) return null;
    B.tick++;
    run.stats.ticks++;
    if (B.tick > D.rules.tickCap) { B.result = 'timeout'; return [{ e: 'msg', text: 'O tempo se esgotou.' }]; }
    var FULL = D.atb.full, events = [];
    var newlyReady = false;
    run.party.forEach(function (h) {
      if (!alive(h) || h.ready) return;
      h.atb = Math.min(FULL, h.atb + effSpd(run, h));
      if (h.atb >= FULL) { h.ready = true; newlyReady = true; }
    });
    B.enemies.forEach(function (e) {
      if (!alive(e)) return;
      e.atb = Math.min(FULL, e.atb + effSpd(run, e));
    });
    // inimigos com ATB cheia agem (em ordem)
    for (var i = 0; i < B.enemies.length; i++) {
      var e = B.enemies[i];
      if (alive(e) && e.atb >= FULL && !B.result) {
        e.atb = 0;
        enemyTurn(run, e, events);
        checkEnd(run, events);
      }
    }
    if (B.result) return events.length ? events : null;
    if (newlyReady) run.party.forEach(function (h) { h.held = false; });
    // turno de herói (modo Espera: o tempo pausa enquanto há comando pendente)
    for (var j = 0; j < run.party.length; j++) {
      var h = run.party[j];
      if (h.ready && alive(h) && !h.held) {
        if (!h.started) {
          h.started = true;
          startTurn(run, h, events);
          if (!alive(h)) { h.ready = false; h.atb = 0; checkEnd(run, events); continue; }
          if (h.skip) { h.skip = false; h.ready = false; h.started = false; h.atb = 0; continue; }
        }
        B.prompt = j;
        break;
      }
    }
    if (B.result) return events;
    return events.length ? events : null;
  }

  // processa início de turno: veneno, duração de status, atordoamento
  function startTurn(run, u, events) {
    var m = mods(run);
    if (!u.enemy && m.mpPerTurn) u.mp = Math.min(u.maxMp, u.mp + m.mpPerTurn);
    if (u.st.poison) {
      var mul = u.enemy ? mget(m, 'poisonMul', 1) : 1;
      var dmg = Math.max(1, Math.round(u.maxHp * D.status.poison.frac * mul));
      u.hp = Math.max(0, u.hp - dmg);
      events.push({ e: 'dmg', to: unitRef(run, u), v: dmg, poison: true, hp: u.hp });
      if (!alive(u)) { onKo(run, u, events); }
    }
    var stunned = !!u.st.stun;
    for (var s in u.st) {
      u.st[s].dur--;
      if (u.st[s].dur <= 0) delete u.st[s];
    }
    if (stunned && alive(u)) { u.skip = true; events.push({ e: 'msg', text: u.name + ' está atordoada!', to: unitRef(run, u) }); }
  }

  function onKo(run, u, events) {
    u.hp = 0; u.atb = 0; u.st = {}; u.ready = false; u.held = false;
    events.push({ e: 'ko', to: unitRef(run, u) });
    var m = mods(run);
    if (!u.enemy && m.revive && !run.fenixUsed) {
      run.fenixUsed = true;
      u.hp = Math.round(u.maxHp * 0.6);
      events.push({ e: 'revive', to: unitRef(run, u), v: u.hp, hp: u.hp, text: 'A Pluma do Último Voo se acende!' });
    }
  }

  function checkEnd(run, events) {
    var B = run.battle;
    if (B.result) return;
    if (!B.enemies.some(alive)) B.result = 'win';
    else if (!run.party.some(alive)) B.result = 'lose';
    if (B.result && events) events.push({ e: 'end', result: B.result });
  }

  function chooseEnemyMove(run, e) {
    var def = D.enemies[e.id];
    var forced = null;
    def.moves.forEach(function (mv, i) {
      if (forced) return;
      if (mv.hpBelow && mv.once && !e.used[i] && e.hp / e.maxHp < mv.hpBelow) { forced = mv; e.used[i] = true; }
    });
    if (!forced) def.moves.forEach(function (mv) {
      if (!forced && mv.every && (e.turns + 1) % mv.every === 0) forced = mv;
    });
    if (forced) return forced;
    var pool = def.moves.filter(function (mv) { return !mv.every && !mv.hpBelow; });
    var tot = pool.reduce(function (s, m) { return s + m.w; }, 0), x = rnd(run) * tot;
    for (var i = 0; i < pool.length; i++) { x -= pool[i].w; if (x <= 0) return pool[i]; }
    return pool[0];
  }

  function enemyTurn(run, e, events) {
    startTurn(run, e, events);
    if (!alive(e)) return;
    if (e.skip) { e.skip = false; return; }
    var mv = chooseEnemyMove(run, e);
    e.turns++;
    var targets;
    var live = run.party.filter(alive);
    if (!live.length) return;
    if (mv.target === 'hero') {
      var taunt = live.filter(function (h) { return h.st.taunt; });
      targets = [taunt.length ? taunt[0] : pick(run, live)];
    } else if (mv.target === 'heroes') targets = live;
    else targets = [e];
    events.push({ e: 'act', who: unitRef(run, e), name: mv.n, boss: !!D.enemies[e.id].boss });
    applyFx(run, e, mv.fx, targets, events, { enemy: true });
  }

  // ---------------------------------------------------------------- efeitos
  function srcStat(run, src, s) {
    if (Array.isArray(src)) return src.reduce(function (a, u) { return a + uStat(run, u, s); }, 0);
    return uStat(run, src, s);
  }
  function isHeroSrc(src) { return Array.isArray(src) || !src.enemy; }

  function calcDmg(run, src, tgt, fx, ctx) {
    var m = mods(run);
    var S = srcStat(run, src, fx.stat);
    var Dv = fx.pierce ? 0 : uStat(run, tgt, 'def') * (fx.stat === 'mag' ? 0.5 : 1);
    var base = Math.max(S * fx.pow * 2 - Dv, S * fx.pow * 0.4);
    base *= 1 + (rnd(run) * 2 - 1) * D.rules.variance;
    var crit = false;
    if (fx.stat === 'atk' && rnd(run) < D.rules.critChance + (isHeroSrc(src) ? (m.crit || 0) : 0)) { base *= D.rules.critMul; crit = true; }
    if (isHeroSrc(src)) {
      base *= mget(m, 'dmgMul', 1);
      if (ctx.skill || ctx.tech) base *= mget(m, 'skillMul', 1);
      var srcs = Array.isArray(src) ? src : [src];
      if (srcs.some(function (u) { return u.st.atkUp; })) base *= D.status.atkUp.mul;
    } else {
      if (src.st.atkUp) base *= D.status.atkUp.mul;
    }
    if (!tgt.enemy) base *= mget(m, 'takenMul', 1);
    if (tgt.st.guard) base *= D.status.guard.mul;
    if (tgt.st.shield) base *= D.status.shield.mul;
    if (tgt.st.prism && fx.stat === 'mag') base *= D.status.prism.magMul;
    return { v: Math.max(1, Math.round(base)), crit: crit };
  }

  function dealDamage(run, src, tgt, amount, events, extra) {
    if (!alive(tgt)) return 0;
    var v = Math.min(tgt.hp, amount);
    tgt.hp -= v;
    var ev = { e: 'dmg', to: unitRef(run, tgt), v: amount, hp: tgt.hp };
    if (extra) for (var k in extra) ev[k] = extra[k];
    events.push(ev);
    if (!alive(tgt)) onKo(run, tgt, events);
    return v;
  }

  function addStatus(run, u, s, dur, events) {
    if (!alive(u)) return;
    var cur = u.st[s];
    u.st[s] = { dur: Math.max(dur + (u.ready && !u.enemy ? 0 : 0), cur ? cur.dur : 0) };
    events.push({ e: 'status', to: unitRef(run, u), s: s });
  }

  function resolveGroup(run, src, to) {
    var heroSide = isHeroSrc(src);
    var mine = heroSide ? run.party : run.battle.enemies;
    var theirs = heroSide ? run.battle.enemies : run.party;
    if (to === 'allies') return mine.filter(alive);
    if (to === 'enemies') return theirs.filter(alive);
    return null;
  }

  function applyFx(run, src, fxList, targets, events, ctx) {
    var m = mods(run);
    var heroSide = isHeroSrc(src);
    fxList.forEach(function (fx) {
      var tg = fx.to ? resolveGroup(run, src, fx.to) : targets;
      if (fx.t === 'dmg') {
        var hits = fx.hits || 1;
        for (var h = 0; h < hits; h++) {
          var list;
          if (fx.random) {
            var pool = (fx.to ? tg : (heroSide ? run.battle.enemies : run.party)).filter(alive);
            if (!pool.length) break;
            list = [pick(run, pool)];
          } else list = tg.filter(alive);
          list.forEach(function (t) {
            var r = calcDmg(run, src, t, fx, ctx);
            var v = dealDamage(run, src, t, r.v, events, { crit: r.crit });
            if (heroSide && m.lifesteal && v > 0) healUnits(run, Array.isArray(src) ? src : [src], Math.max(1, Math.round(v * m.lifesteal / (Array.isArray(src) ? 2 : 1))), events, true);
            if (!heroSide && fx.drain && v > 0) healUnits(run, [src], Math.round(v * fx.drain), events, true);
            if (heroSide && ctx.attack && m.poisonOnHit && alive(t) && rnd(run) < m.poisonOnHit) addStatus(run, t, 'poison', 3, events);
            if (!heroSide && m.reflect && fx.stat === 'atk' && v > 0 && alive(src)) {
              dealDamage(run, t, src, Math.max(1, Math.round(v * m.reflect)), events, { reflect: true });
            }
          });
        }
      } else if (fx.t === 'flat') {
        tg.filter(alive).forEach(function (t) { dealDamage(run, src, t, fx.v + (fx.perAct || 0) * run.act, events); });
      } else if (fx.t === 'heal') {
        var amt = Math.round(srcStat(run, src, 'mag') * fx.pow * 2 * (1 + (rnd(run) * 2 - 1) * 0.08));
        healUnits(run, tg, amt, events);
      } else if (fx.t === 'healPct') {
        tg.filter(alive).forEach(function (t) { healUnits(run, [t], Math.round(t.maxHp * fx.v), events); });
      } else if (fx.t === 'status') {
        tg.forEach(function (t) {
          if (!alive(t)) return;
          if (fx.chance != null && rnd(run) >= fx.chance) { events.push({ e: 'miss', to: unitRef(run, t) }); return; }
          addStatus(run, t, fx.s, fx.dur, events);
        });
      } else if (fx.t === 'mp') {
        tg.filter(alive).forEach(function (t) {
          if (t.enemy) return;
          var before = t.mp; t.mp = Math.min(t.maxMp, t.mp + fx.v);
          events.push({ e: 'mp', to: unitRef(run, t), v: t.mp - before, mp: t.mp });
        });
      } else if (fx.t === 'atb') {
        tg.filter(alive).forEach(function (t) {
          if (fx.v === 'full') { t.atb = D.atb.full; }
          else { t.atb = 0; if (!t.enemy) { t.ready = false; t.held = false; t.started = false; } }
          events.push({ e: 'atb', to: unitRef(run, t), full: fx.v === 'full' });
        });
      } else if (fx.t === 'revive') {
        tg.forEach(function (t) {
          if (alive(t)) return;
          t.hp = Math.max(1, Math.round(t.maxHp * fx.frac)); t.atb = 0; t.st = {}; t.ready = false; t.held = false; t.started = false;
          events.push({ e: 'revive', to: unitRef(run, t), v: t.hp, hp: t.hp });
        });
      } else if (fx.t === 'steal') {
        tg.forEach(function (t) {
          if (rnd(run) < fx.chance && run.items.length < D.rules.itemSlots) {
            var it = rnd(run) < 0.12 ? 'eter' : pick(run, ['erva', 'erva', 'eter', 'bomba', 'cha']);
            run.items.push(it);
            events.push({ e: 'msg', text: 'Pegou ' + D.items[it].name + '!' });
          } else events.push({ e: 'msg', text: 'Nada para pegar.' });
        });
      }
    });
  }

  function healUnits(run, list, amt, events, quiet) {
    list.forEach(function (t) {
      if (!alive(t)) return;
      var before = t.hp;
      t.hp = Math.min(t.maxHp, t.hp + amt);
      events.push({ e: 'heal', to: unitRef(run, t), v: t.hp - before, quiet: !!quiet, hp: t.hp });
    });
  }

  // ---------------------------------------------------------------- ações do jogador
  function partnerOf(run, h) { return run.party.filter(function (x) { return x !== h; })[0]; }
  function techFor(run) {
    var ids = run.party.map(function (h) { return h.id; });
    for (var t in D.techs) {
      var p = D.techs[t].pair;
      if (ids.indexOf(p[0]) >= 0 && ids.indexOf(p[1]) >= 0) return t;
    }
    return null;
  }
  function techCost(run, tid, heroId) {
    return Math.ceil(D.techs[tid].cost[heroId] * mget(mods(run), 'techCostMul', 1));
  }
  function targetsFor(run, h, type) {
    var B = run.battle;
    if (type === 'enemy') return B.enemies.map(function (e, i) { return alive(e) ? i : -1; }).filter(function (i) { return i >= 0; });
    if (type === 'ally') return run.party.map(function (x, i) { return alive(x) ? i : -1; }).filter(function (i) { return i >= 0; });
    if (type === 'deadAlly') return run.party.map(function (x, i) { return !alive(x) ? i : -1; }).filter(function (i) { return i >= 0; });
    if (type === 'partner') { var p = partnerOf(run, h); return p && alive(p) && !p.ready ? [run.party.indexOf(p)] : []; }
    return null; // sem escolha
  }
  function techReady(run, h) {
    var tid = techFor(run);
    if (!tid) return { ok: false };
    var p = partnerOf(run, h);
    var ok = p && alive(p) && p.ready && !p.skip && h.mp >= techCost(run, tid, h.id) && p.mp >= techCost(run, tid, p.id);

  }

  // Lista de ações legais para a heroína com o turno (o "menu de comandos").
  function legalActions(run) {
    var B = run.battle;
    if (!B || B.prompt == null || B.result) return [];
    var h = run.party[B.prompt];
    var acts = [];
    acts.push({ kind: 'attack', targets: targetsFor(run, h, 'enemy') });
    h.skills.forEach(function (sid) {
      var s = D.skills[sid];
      if (h.mp < s.mp) return;
      var t = targetsFor(run, h, s.target);
      if (t && !t.length) return;
      acts.push({ kind: 'skill', id: sid, targets: t });
    });
    var tr = techReady(run, h);
    if (tr.ok) {
      var tt = D.techs[tr.id];
      var tg = targetsFor(run, h, tt.target);
      if (!(tg && !tg.length)) acts.push({ kind: 'tech', id: tr.id, targets: tg });
    }
    var seen = {};
    run.items.forEach(function (it) {
      if (seen[it]) return; seen[it] = true;
      var t = targetsFor(run, h, D.items[it].target);
      if (t && !t.length) return;
      acts.push({ kind: 'item', id: it, targets: t });
    });
    acts.push({ kind: 'defend', targets: null });
    var p = partnerOf(run, h);
    if (p && alive(p) && !p.ready && !p.st.stun) acts.push({ kind: 'hold', targets: null });
    return acts;
  }

  function doAction(run, action) {
    var B = run.battle;
    var hi = B.prompt;
    var h = run.party[hi];
    var m = mods(run);
    var events = [];
    var legal = legalActions(run).filter(function (a) { return a.kind === action.kind && a.id === action.id; })[0];
    if (!legal) throw new Error('ação ilegal: ' + JSON.stringify(action));
    if (legal.targets && legal.targets.indexOf(action.target) < 0) throw new Error('alvo ilegal');
    run.stats.decisions++;
    var targetUnit = function (type, idx) {
      if (type === 'enemy') return [B.enemies[idx]];
      if (type === 'ally' || type === 'deadAlly' || type === 'partner') return [run.party[idx]];
      if (type === 'enemies') return B.enemies.filter(alive);
      if (type === 'allies') return run.party.filter(alive);

    };

      return events;
    }
    if (action.kind === 'attack') {
      events.push({ e: 'act', who: unitRef(run, h), name: 'Atacar', basic: true });
      var tgt = B.enemies[action.target];
      if (m.doubleAttack) {
        applyFx(run, h, [{ t: 'dmg', stat: 'atk', pow: 0.85 }], [tgt], events, { attack: true });
        var t2 = alive(tgt) ? tgt : B.enemies.filter(alive)[0];
        if (t2) applyFx(run, h, [{ t: 'dmg', stat: 'atk', pow: 0.85 }], [t2], events, { attack: true });
      } else applyFx(run, h, [{ t: 'dmg', stat: 'atk', pow: 1 }], [tgt], events, { attack: true });
    } else if (action.kind === 'skill') {
      var s = D.skills[action.id];
      h.mp -= s.mp;
      events.push({ e: 'act', who: unitRef(run, h), name: s.name, skill: action.id });
      applyFx(run, h, s.fx, targetUnit(s.target, action.target), events, { skill: true });
      if (m.echo && rnd(run) < m.echo && B.enemies.some(alive) && run.party.some(alive)) {
        var tu = targetUnit(s.target, action.target).filter(function (u) { return s.target === 'deadAlly' ? !alive(u) : alive(u); });
        if (s.target === 'enemy' && !tu.length) tu = [B.enemies.filter(alive)[0]];
        if (tu.length && tu[0]) { events.push({ e: 'act', who: unitRef(run, h), name: s.name + ' (eco)', skill: action.id }); applyFx(run, h, s.fx, tu, events, { skill: true }); }
      }
    } else if (action.kind === 'tech') {
      var T = D.techs[action.id];
      var p = partnerOf(run, h);
      h.mp -= techCost(run, action.id, h.id);
      p.mp -= techCost(run, action.id, p.id);
      events.push({ e: 'act', who: unitRef(run, h), partner: unitRef(run, p), name: T.name, tech: action.id });
      applyFx(run, [h, p], T.fx, targetUnit(T.target, action.target), events, { tech: true });
      if (m.techBuff) { addStatus(run, h, 'atkUp', 3, events); addStatus(run, p, 'atkUp', 3, events); }
      finish.push(p);
    } else if (action.kind === 'item') {
      var it = D.items[action.id];
      run.items.splice(run.items.indexOf(action.id), 1);
      events.push({ e: 'act', who: unitRef(run, h), name: it.name, item: action.id });
      applyFx(run, h, it.fx, targetUnit(it.target, action.target), events, { item: true });

      events.push({ e: 'act', who: unitRef(run, h), name: 'Defender' });
      addStatus(run, h, 'guard', 1, events);

  // ---------------------------------------------------------------- pós-combate e recompensas
  function relicPool(run, rarity) {

  function skillPool(run) {

  }

    if (o) { grant(run, o); run.log.push({ t: 'pick', kind: o.kind, id: o.id, offered: run.pending.options.map(function (x) { return x.kind + ':' + x.id; }) }); }

  }

  function restChoice(run, choice) {
    if (run.phase !== 'rest') throw new Error('não está descansando');
    run.stats.decisions++;
    var events = [];
    if (choice === 'rest') {
      run.party.forEach(function (h) { h.hp = Math.min(h.maxHp, h.hp + Math.round(h.maxHp * D.rules.restHeal)); h.mp = h.maxMp; });
    } else {
      run.party.forEach(function (h) { gainXp(run, h, Math.max(1, xpToNext(h)), events); });

  function eventChoice(run, idx) {

    applyEventFx(run, ch.fx, out);

    var story = out.filter(function (o) { return o.story; }).map(function (o) { return o.story; });

  }

  function applyEventFx(run, fxList, out) {
    fxList.forEach(function (fx) {
      if (fx.t === 'heal') { run.party.forEach(function (h) { h.hp = Math.min(h.maxHp, Math.max(1, h.hp) + Math.round(h.maxHp * fx.v)); }); out.push({ text: 'O grupo recupera ' + Math.round(fx.v * 100) + '% de PV.' }); }
      else if (fx.t === 'hurt') { run.party.forEach(function (h) { h.hp = Math.max(1, h.hp - Math.round(h.hp * fx.v)); }); out.push({ text: 'Vocês sentem as horas escorrerem.' }); }

      } else if (fx.t === 'item') {

})();

        el('span', { class: 'n', text: h.name }),
        el('div', {}, [el('div', { class: 'lbl' }, [el('span', { text: 'PV' }), el('span', { text: d.hp + '/' + h.maxHp })]), barEl('', d.hp / h.maxHp)]),
        el('div', {}, [el('div', { class: 'lbl' }, [el('span', { text: 'MP ' + d.mp }), el('span', { text: 'ATB' })]), atbBar]),
        el('div', { class: 'sts', text: st })
      ]));
    });
  }
  function updateAtbBars() {
    var bars = partyBox.querySelectorAll('[data-atb]');
    for (var k = 0; k < bars.length; k++) {
      var h = S.run.party[+bars[k].getAttribute('data-atb')];
      bars[k].firstChild.style.width = (h.hp > 0 ? h.atb / D.atb.full * 100 : 0) + '%';
      bars[k].className = 'bar atb' + (h.ready ? ' full' : '');
    }
  }

  // menu de comandos (estilo Dragon Quest: poucas palavras, sempre as mesmas posições)
  function renderCmds() {
    var r = S.run, B = r.battle;
    cmdBox.innerHTML = '';
    if (!B || B.result || B.prompt == null || BV.cur || BV.queue.length || BV.hold > 0) return;
    var h = r.party[B.prompt];
    var acts = E.legalActions(r);
    var find = function (k) { return acts.filter(function (a) { return a.kind === k; }); };
    if (!S.menu) {
      setMsg(h.name, 'O que fazer?');
      var tr = E.techReady(r, h), tid = E.techFor(r);
      var tech = find('tech')[0];
      var techWhy = !tid ? '' : !tr.partnerReady ? 'A parceira ainda não está pronta (barra amarela cheia). Use Segurar ou o Badalo.' : !tr.mpOk ? 'MP insuficiente: ' + D.techs[tid].name + ' custa ' + E.techCost(r, tid, h.id) + ' MP de ' + h.name + ' e ' + E.techCost(r, tid, E.partnerOf(r, h).id) + ' da parceira.' : 'Indisponível agora.';
      var g = el('div', { class: 'cmds' }, [
        btn('Atacar', function () { pickTarget({ kind: 'attack' }, find('attack')[0].targets, 'enemy'); }, 'primary', { 'data-cmd': 'attack' }),
        btn('Técnica', function () { S.menu = 'skills'; renderCmds(); }, '', { 'data-cmd': 'skills' }),
        btn('Dupla', function () { if (tech) chooseAction({ kind: 'tech', id: tech.id }, tech.targets, D.techs[tech.id].target); }, 'tech' + (tech ? ' ready' : ''), tech ? { 'data-cmd': 'tech' } : { 'aria-disabled': 'true', 'data-why': techWhy, 'data-cmd': 'tech' }),
        btn('Item', function () { S.menu = 'items'; renderCmds(); }, '', r.items.length ? { 'data-cmd': 'items' } : { 'aria-disabled': 'true', 'data-why': 'A bolsa está vazia.', 'data-cmd': 'items' }),
        btn('Defender', function () { act({ kind: 'defend' }); }, '', { 'data-cmd': 'defend' }),
        btn('Segurar', function () { act({ kind: 'hold' }); }, '', find('hold').length ? { 'data-cmd': 'hold' } : { 'aria-disabled': 'true', 'data-why': 'Só dá para segurar enquanto a parceira está de pé e carregando.', 'data-cmd': 'hold' })
      ]);
      cmdBox.appendChild(g);
      view.scrollTop = 0;
      return;
    }
    var list = el('div', { class: 'list' });
    if (S.menu === 'skills') {
      setMsg(h.name, 'Qual técnica?');
      h.skills.forEach(function (sid) {
        var s = D.skills[sid], a = acts.filter(function (x) { return x.kind === 'skill' && x.id === sid; })[0];
        var why = h.mp < s.mp ? 'MP insuficiente.' : 'Sem alvo válido agora.';
        list.appendChild(btn([el('span', {}, [el('b', { text: s.name }), el('small', { text: s.desc })]), el('span', { class: 'cost', text: s.mp + ' MP' })],
          function () { chooseAction({ kind: 'skill', id: sid }, a.targets, s.target); }, '', a ? { 'data-skill': sid } : { 'aria-disabled': 'true', 'data-why': why, 'data-skill': sid }));
      });
    } else if (S.menu === 'items') {
      setMsg(h.name, 'Qual item?');
      var counts = {}; r.items.forEach(function (i) { counts[i] = (counts[i] || 0) + 1; });
      Object.keys(counts).forEach(function (iid) {
        var it = D.items[iid], a = acts.filter(function (x) { return x.kind === 'item' && x.id === iid; })[0];
        list.appendChild(btn([el('span', {}, [el('b', { text: it.name }), el('small', { text: it.desc })]), el('span', { class: 'cost', text: 'x' + counts[iid] })],
          function () { chooseAction({ kind: 'item', id: iid }, a.targets, it.target); }, '', a ? {} : { 'aria-disabled': 'true', 'data-why': 'Sem alvo válido agora.' }));
      });
    } else if (S.menu && S.menu.target) {
      var m = S.menu;
      setMsg(h.name, m.type === 'enemy' ? 'Em quem?' : 'Em quem? (aliada)');
      m.targets.forEach(function (ti) {
        var u = m.type === 'enemy' ? B.enemies[ti] : r.party[ti];
        var sts = Object.keys(u.st || {}).map(function (s) { return ST_NAME[s]; }).join(', ');
        list.appendChild(btn([el('span', {}, [el('b', { text: u.name }), el('small', { text: (u.hp > 0 ? 'PV ' + u.hp + '/' + u.maxHp : 'Caída') + (sts ? ' · ' + sts : '') })])],
          function () { var a2 = {}; for (var k in m.action) a2[k] = m.action[k]; a2.target = ti; act(a2); }, '', { 'data-target': ti }));
      });
    }
    list.appendChild(btn('Voltar', function () { S.menu = (S.menu && S.menu.target && S.menu.from) ? S.menu.from : null; renderCmds(); }, 'small'));
    cmdBox.appendChild(list);
    // em telas baixas, traz a lista inteira para a vista
    view.scrollTop = view.scrollHeight;
  }
  function pickTarget(action, targets, type, from) {
    S.menu = { target: true, action: action, targets: targets, type: type, from: from || null };
    renderCmds();
  }
  function chooseAction(action, targets, type) {
    if (targets && (type === 'enemy' || type === 'ally' || type === 'deadAlly')) {
      if (targets.length === 1 && type !== 'enemy') { action.target = targets[0]; act(action); return; }
      pickTarget(action, targets, type === 'enemy' ? 'enemy' : 'ally', S.menu);
      return;
    }
    if (targets && type === 'partner') action.target = targets[0];
    act(action);
  }
  function onStageTap(ev) {
    if (!S.menu || !S.menu.target || S.menu.type !== 'enemy') return;
    var rect = canvas.getBoundingClientRect();
    var x = (ev.clientX - rect.left) / rect.width * LW, y = (ev.clientY - rect.top) / rect.height * LH;
    for (var k = 0; k < S.menu.targets.length; k++) {
      var ti = S.menu.targets[k], b = unitBox({ side: 'e', i: ti });
      if (x >= b.x - 3 && x <= b.x + b.w + 3 && y >= b.y - 3 && y <= b.y + b.h + 3) {
        var a2 = {}; for (var kk in S.menu.action) a2[kk] = S.menu.action[kk]; a2.target = ti;
        AUDIO.sfx('cursor'); act(a2); return;
      }
    }
  }
  function act(action) {
    S.menu = null;
    var evs;
    try { evs = E.doAction(S.run, action); } catch (e) { toast('Ação inválida.'); renderCmds(); return; }
    cmdBox.innerHTML = '';
    BV.queue = BV.queue.concat(evs);
    saveRun();
  }

  // ---------------------------------------------------------------- reprodução de eventos
  var SPD = { 1: 1, 2: 1.7, 3: 2.6 };
  function evDuration(ev) {
    var base = { act: 480, dmg: 260, heal: 240, mp: 160, status: 200, miss: 170, ko: 420, revive: 420, atb: 140, msg: 650, hold: 380, end: 350 }[ev.e] || 150;
    if (ev.e === 'act' && ev.tech) base = 900;
    if (ev.e === 'heal' && ev.quiet) base = 120;
    return base / SPD[S.settings.speed];
  }
  function popup(ref, text, cls) {
    var b = unitBox(ref);
    var p = el('div', { class: 'pop ' + (cls || ''), text: text });
    p.style.left = ((b.x + b.w / 2) * scale + 2) + 'px';
    p.style.top = ((b.y + 4) * scale + 2) + 'px';
    popLayer.appendChild(p);
    setTimeout(function () { p.remove(); }, 950);
  }
  function burst(ref, color, n) {
    var b = unitBox(ref);
    for (var k = 0; k < (n || 8); k++) {
      BV.particles.push({ x: b.x + b.w / 2, y: b.y + b.h / 2, vx: (Math.random() - 0.5) * 60, vy: (Math.random() - 0.8) * 50, life: 0.5, c: color });
    }
  }
  function playEvent(ev) {
    var r = S.run;
    if (ev.e === 'act') {
      var who = unitOf(ev.who);
      BV.actor = [unitKey(ev.who)];
      if (ev.partner) BV.actor.push(unitKey(ev.partner));
      var whoName = ev.partner ? who.name + ' + ' + unitOf(ev.partner).name : who.name;
      setMsg(whoName, ev.name + (ev.tech ? '!!' : ev.basic ? '' : '!'));
      AUDIO.sfx(ev.tech ? 'tech' : ev.item ? 'item' : ev.basic ? 'swing' : ev.who.side === 'h' ? 'magic' : 'swing');
      if (ev.tech) { burst(ev.who, '#d6c6ff', 14); burst(ev.partner, '#ffd860', 14); }
    } else if (ev.e === 'dmg') {
      var k = unitKey(ev.to);
      if (BV.disp[k]) BV.disp[k].hp = ev.hp;
      BV.flash[k] = 0.16;
      popup(ev.to, String(ev.v) + (ev.crit ? '!' : ''), ev.poison ? 'poison' : ev.crit ? 'crit' : '');
      burst(ev.to, ev.poison ? '#b080ff' : ev.to.side === 'e' ? '#fff3c0' : '#ff7060', ev.crit ? 12 : 6);
      AUDIO.sfx(ev.crit ? 'crit' : 'hit');
    } else if (ev.e === 'heal') {
      if (BV.disp[unitKey(ev.to)]) BV.disp[unitKey(ev.to)].hp = ev.hp;
      if (!ev.quiet || ev.v > 0) popup(ev.to, '+' + ev.v, 'heal');
      if (!ev.quiet) { burst(ev.to, '#8cf08c', 8); AUDIO.sfx('heal'); }
    } else if (ev.e === 'mp') {
      if (BV.disp[unitKey(ev.to)]) BV.disp[unitKey(ev.to)].mp = ev.mp;
      popup(ev.to, '+' + ev.v + ' MP', 'mp');
    } else if (ev.e === 'status') {
      popup(ev.to, ST_NAME[ev.s], 'st');
    } else if (ev.e === 'miss') {
      popup(ev.to, 'resistiu', 'st');
    } else if (ev.e === 'ko') {
      var u = unitOf(ev.to);
      if (BV.disp[unitKey(ev.to)]) BV.disp[unitKey(ev.to)].hp = 0;
      setMsg('', u.name + (ev.to.side === 'h' ? ' caiu!' : ' foi derrotado!'));
      burst(ev.to, '#ffffff', 16);
      AUDIO.sfx('ko');
    } else if (ev.e === 'revive') {
      if (BV.disp[unitKey(ev.to)]) BV.disp[unitKey(ev.to)].hp = ev.hp;
      popup(ev.to, '+' + ev.v, 'heal');
      setMsg('', ev.text || unitOf(ev.to).name + ' se levanta!');
      AUDIO.sfx('heal');
    } else if (ev.e === 'atb') {
      popup(ev.to, ev.full ? 'PRONTA!' : 'ATB 0', 'st');
      if (ev.full) AUDIO.sfx('bell');
    } else if (ev.e === 'msg') {
      setMsg('', ev.text);
    } else if (ev.e === 'hold') {
      setMsg(unitOf(ev.who).name, 'segura o turno e espera a parceira.');
    } else if (ev.e === 'end') {
      if (ev.result === 'win') { setMsg('', 'Vitória!'); AUDIO.music(null); AUDIO.sfx('victory'); }
      else if (ev.result === 'lose') { setMsg('', 'O grupo caiu...'); AUDIO.music(null); }
    }
    renderParty();
  }

  function loop(now) {
    BV.raf = requestAnimationFrame(loop);
    var dt = Math.min(0.1, (now - BV.last) / 1000);
    BV.last = now;
    BV.fpsFrames++;
    var r = S.run;
    if (!r || !r.battle) { draw(dt); return; }
    var B = r.battle;
    if (BV.hold > 0) { BV.hold -= dt * 1000; if (BV.hold <= 0) { renderParty(); renderCmds(); } }
    else if (BV.cur) {
      BV.t -= dt * 1000;
      if (BV.t <= 0) { BV.cur = null; BV.actor = []; }
    }
    if (!BV.cur && BV.hold <= 0) {
      if (BV.queue.length) {
        BV.cur = BV.queue.shift();
        BV.t = evDuration(BV.cur);
        playEvent(BV.cur);
      } else if (B.result) {
        if (!BV.ended) { BV.ended = true; BV.hold = 600; }
        else { finishBattleView(); return; }
      } else if (B.prompt == null) {
        // tempo ativo: avança ticks do ATB (pausado durante animações e menus)
        BV.acc += dt * D.atb.ticksPerSecond * SPD[S.settings.speed];
        var guard = 0;
        while (BV.acc >= 1 && guard++ < 60) {
          BV.acc -= 1;
          var evs = E.stepBattle(r);
          if (evs) { BV.queue = BV.queue.concat(evs); BV.acc = 0; break; }
          if (B.prompt != null) { BV.acc = 0; AUDIO.sfx('cursor'); renderParty(); renderCmds(); saveRun(); break; }
        }
        updateAtbBars();
      } else if (!cmdBox.firstChild) { renderParty(); renderCmds(); }
    }
    draw(dt);
  }

  function finishBattleView() {
    stopBattleLoop();
    var r = S.run, B = r.battle;
    var won = B.result === 'win';
    var bossId = won && B.kind === 'boss' ? B.group[0] : null;
    var res = E.finishBattle(r);
    S.levelUps = res.events.filter(function (e) { return e.e === 'lvl'; });
    if (S.levelUps.length) AUDIO.sfx('level');
    if (bossId) { E.recordBoss(S.meta, bossId); saveMeta(); }
    if (r.phase === 'over') { endRunFlow(); return; }
    saveRun();
    var st = bossId ? E.pullStory(S.meta, 1).filter(function (s) { return s.when.boss; }) : [];
    if (st.length) { saveMeta(); showStory(st, function () { go('reward'); }); }
    else go('reward');
  }

  // ---------------------------------------------------------------- desenho do palco
  function draw(dt) {
    if (!ctx || S.screen !== 'battle' || !S.run) return;
    var r = S.run, B = r.battle;
    var t = performance.now() / 1000;
    ctx.clearRect(0, 0, LW, LH);
    drawSky(ctx, LW, LH, r.act, t);
    if (!B) return;
    var units = [];
    B.enemies.forEach(function (e, i) { units.push({ ref: { side: 'e', i: i }, u: e }); });
    r.party.forEach(function (h, i) { units.push({ ref: { side: 'h', i: i }, u: h }); });
    units.sort(function (a, b) { var A = unitBox(a.ref), Bx = unitBox(b.ref); return (A.y + A.h) - (Bx.y + Bx.h); });
    units.forEach(function (o) {
      var k = unitKey(o.ref), b = unitBox(o.ref), u = o.u;
      var dHp = BV.disp[k] ? BV.disp[k].hp : u.hp;
      var dead = dHp <= 0;
      if (dead && o.ref.side === 'e' && !BV.flash[k]) return;
      var x = b.x, y = b.y;
      if (!dead) y += Math.floor((t * 2 + o.ref.i * 0.5) % 2) === 0 ? 0 : -1 * (o.ref.side === 'h' ? 1 : 0);
      if (BV.actor.indexOf(k) >= 0) x += o.ref.side === 'h' ? -6 : 6;
      if (o.ref.side === 'h' && B.prompt === o.ref.i && !BV.cur) x -= 3;
      if (BV.flash[k] > 0) { x += (Math.random() < 0.5 ? -1 : 1); }
      // sombra no chão
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(Math.round(b.x + 2), Math.round(b.y + b.h - 1), b.w - 4, 2);
      var img;
      if (o.ref.side === 'h') img = spriteCanvas(u.id, null, BV.flash[k] > 0 && Math.floor(t * 30) % 2 ? 'white' : dead ? 'gray' : null);
      else { var es = enemySprite(u); img = spriteCanvas(es.id, es.pal, BV.flash[k] > 0 && Math.floor(t * 30) % 2 ? 'white' : null); }
      if (dead && o.ref.side === 'h') {
        ctx.save(); ctx.translate(Math.round(x + b.w / 2), Math.round(y + b.h)); ctx.rotate(-Math.PI / 2); ctx.drawImage(img, -b.h + 2, -b.w / 2); ctx.restore();
      } else ctx.drawImage(img, Math.round(x), Math.round(y));
      // barra de PV dos inimigos
      if (o.ref.side === 'e' && !dead && !D.enemies[u.id].boss) {
        ctx.fillStyle = '#140c1c'; ctx.fillRect(Math.round(b.x + 1), Math.round(b.y + b.h + 1), b.w - 2, 2);
        ctx.fillStyle = '#e2574a'; ctx.fillRect(Math.round(b.x + 1), Math.round(b.y + b.h + 1), Math.max(1, Math.round((b.w - 2) * dHp / u.maxHp)), 2);
      }
      // seta da vez
      if (o.ref.side === 'h' && B.prompt === o.ref.i && !BV.cur && Math.floor(t * 3) % 2 === 0) {
        ctx.fillStyle = '#ffd860'; ctx.fillRect(Math.round(x + 7), Math.round(b.y - 5), 3, 1); ctx.fillRect(Math.round(x + 8), Math.round(b.y - 4), 1, 1);
      }
      // alvo selecionável
      if (o.ref.side === 'e' && S.menu && S.menu.target && S.menu.type === 'enemy' && S.menu.targets.indexOf(o.ref.i) >= 0 && Math.floor(t * 3) % 2 === 0) {
        ctx.fillStyle = '#ffd860'; ctx.fillRect(Math.round(b.x + b.w / 2 - 1), Math.round(b.y - 5), 3, 1); ctx.fillRect(Math.round(b.x + b.w / 2), Math.round(b.y - 4), 1, 1);
      }
      if (BV.flash[k] > 0) BV.flash[k] -= dt;
    });
    // barra de PV do chefe
    var boss = B.enemies.filter(function (e) { return D.enemies[e.id].boss; })[0];
    if (boss) {
      var dh = BV.disp.e0 ? BV.disp.e0.hp : boss.hp;
      ctx.fillStyle = '#140c1c'; ctx.fillRect(4, 3, LW - 8, 4);
      ctx.fillStyle = '#e2574a'; ctx.fillRect(5, 4, Math.max(0, Math.round((LW - 10) * dh / boss.maxHp)), 2);
    }
    // partículas
    BV.particles = BV.particles.filter(function (p) {
      p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 90 * dt;
      if (p.life <= 0) return false;
      ctx.fillStyle = p.c; ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 1);
      return true;
    });
  }

  // ---------------------------------------------------------------- arranque
  function boot() {
    var app = document.getElementById('app');
    S.meta = loadMeta();
    var st = load(KEYS.settings, null);
    if (st) { S.settings.muted = !!st.muted; S.settings.speed = [1, 2, 3].indexOf(st.speed) >= 0 ? st.speed : 2; }
    AUDIO.setMuted(S.settings.muted);
    seedChip = btn('#', function () {
      var txt = E.seedToStr(S.run.seed);
      try { navigator.clipboard.writeText(txt).then(function () { toast('Semente ' + txt + ' copiada.'); }, function () { toast('Semente: ' + txt); }); }
      catch (e) { toast('Semente: ' + txt); }
    }, 'chip', { id: 'seedChip', 'aria-label': 'Semente da jornada' });
    where = el('span', { id: 'where' });
    spdBtn = btn('2x', function () { S.settings.speed = S.settings.speed % 3 + 1; saveSettings(); setBar(); }, 'chip', { id: 'spdBtn', 'aria-label': 'Velocidade do combate' });
    sndBtn = btn('SOM', function () { S.settings.muted = !S.settings.muted; AUDIO.setMuted(S.settings.muted); saveSettings(); setBar(); }, 'chip', { id: 'sndBtn', 'aria-label': 'Ligar ou desligar o som' });
    bar = el('header', { id: 'bar' }, [seedChip, where, spdBtn, sndBtn]);
    view = el('main', { id: 'view' });
    app.appendChild(bar); app.appendChild(view);
    go('title');
    // sem a fonte pixelada (offline/bloqueada), o fallback monoespaçado é largo: reduz o corpo
    try { if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (!document.fonts.check('16px VT323')) document.body.classList.add('nofont'); }); } catch (e) { /* ignora */ }
    window.addEventListener('resize', function () { if (S.screen === 'battle' && S.run && S.run.battle) { var q = BV.queue, c = BV.cur; startBattleView(); BV.queue = q; BV.cur = c; BV.hold = 0; } });
    document.addEventListener('visibilitychange', function () { if (document.hidden) saveRun(); });
    // ganchos de teste/medição (não alteram regras)
    window.__ECOS = { S: S, E: E, fps: function () { return BV.fpsFrames; }, KEYS: KEYS };
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
